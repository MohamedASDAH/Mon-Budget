main{max-width:1440px;padding:26px 30px 48px}.hd{margin-bottom:24px}.hd h1{font-size:25px;font-weight:750;letter-spacing:-.8px}.hd p{color:#9ba8c5}
.cd{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.035) 52%,rgba(110,130,200,.035));border:1px solid rgba(205,216,255,.15);border-radius:22px;padding:20px;box-shadow:0 18px 48px rgba(0,0,0,.19),inset 0 1px 0 rgba(255,255,255,.09);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);transition:transform .25s,border-color .25s,background .25s}
.cd:before{content:'';position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);pointer-events:none}.cd:hover{transform:translateY(-2px);border-color:rgba(155,139,255,.32);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.045))}
.cd h3{font-size:15px;font-weight:650;letter-spacing:-.15px;margin-bottom:16px}.kp{background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1px solid rgba(205,216,255,.14);box-shadow:0 14px 38px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.08)}.kp .ic{width:40px;height:40px;border-radius:13px}.kp b{font-size:26px;letter-spacing:-.9px}
.hero{border:1px solid rgba(255,255,255,.18);background:linear-gradient(118deg,rgba(73,57,157,.88),rgba(54,82,176,.78) 55%,rgba(15,143,153,.74));box-shadow:0 22px 55px rgba(50,55,150,.24);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.hero .hs div{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);box-shadow:inset 0 1px rgba(255,255,255,.12)}

button{border-radius:12px}button:not(.g):not(.x):not(.ni):not(.lk):not(#mic):not(#bn button){background:linear-gradient(130deg,#8065f2,#557ff0);box-shadow:0 7px 22px rgba(94,91,220,.25)}button.g{background:rgba(255,255,255,.055);border:1px solid rgba(200,211,255,.14);color:var(--tx)}
.seg{background:rgba(5,10,24,.35);border:1px solid rgba(196,207,255,.12);border-radius:13px;padding:4px;backdrop-filter:blur(12px)}.seg button.on{background:linear-gradient(130deg,#8065f2,#4d8bdc);box-shadow:0 5px 16px rgba(102,85,225,.3)}
input,select{background:rgba(4,10,25,.25);border:1px solid rgba(191,204,255,.12);border-radius:12px}input:hover{background:rgba(255,255,255,.06)}input:focus,select:focus{outline:2px solid rgba(140,119,255,.55);border-color:rgba(153,133,255,.5);background:rgba(10,17,37,.65)}.fi{background:rgba(4,10,25,.3);border-color:rgba(191,204,255,.13)}
.stat div{background:rgba(6,13,30,.34);border:1px solid rgba(190,204,255,.11);border-radius:14px;padding:12px 14px}.stat b{font-size:17px}.bar{height:8px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.035)}.bar i{box-shadow:0 0 12px color-mix(in srgb,var(--ac) 35%,transparent)}
.tx{border-color:rgba(190,204,255,.10);padding:11px 2px}.ti{width:38px;height:38px;border:1px solid rgba(190,204,255,.11);background:rgba(255,255,255,.055);border-radius:12px}.r{border-color:rgba(190,204,255,.10);padding:7px 0}.r.tt{border-color:rgba(190,204,255,.2)}
.add input{background:rgba(6,13,30,.35);border-color:rgba(190,204,255,.2)}.sf{background:rgba(255,255,255,.045);border:1px solid rgba(190,204,255,.12);border-radius:15px;padding:11px}
#bn{background:rgba(7,12,27,.82);border-top:1px solid rgba(190,204,255,.15);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%)}#bn button.on{color:#fff}#bn button.on b{color:#b6a6ff}
.toast{background:rgba(19,27,48,.92);border:1px solid rgba(190,204,255,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}#ci,.note{background:rgba(5,12,29,.35);border:1px solid rgba(190,204,255,.12);border-radius:14px}
#chat .m.a,.chatbox,.acard{background:rgba(18,27,49,.68);border:1px solid rgba(190,204,255,.14);box-shadow:inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#cs{display:block;width:100%;height:auto;overflow:visible;margin:8px 0 4px;touch-action:pan-y}#cs text{font-family:inherit}#cs circle{filter:drop-shadow(0 0 5px rgba(80,220,220,.25))}#ci,#cix{background:linear-gradient(110deg,rgba(45,212,191,.10),rgba(121,87,232,.12));border:1px solid rgba(111,215,221,.2);border-radius:14px;padding:11px 13px;min-height:44px}
:root[data-theme=light]{--bg:#e9edf8;--sb:rgba(255,255,255,.78);--cd:rgba(255,255,255,.72);--in:rgba(255,255,255,.62);--bd:rgba(84,98,145,.14);--tx:#20263b;--mu:#707b98;--hv:rgba(85,100,160,.07);--nv:rgba(255,255,255,.84);--shd:0 16px 40px rgba(52,67,110,.10);color-scheme:light}
:root[data-theme=light] body{background-color:#e9edf8;background-image:radial-gradient(ellipse 650px 480px at 10% -5%,rgba(121,87,232,.16),transparent 70%),radial-gradient(ellipse 580px 420px at 92% 12%,rgba(45,180,180,.12),transparent 70%),linear-gradient(145deg,#f0f2fa,#e5eaf5 65%,#edf0f8)}:root[data-theme=light] body::before{opacity:.18}
:root[data-theme=light] #sb,:root[data-theme=light] #bn{background:rgba(255,255,255,.76);border-color:rgba(84,98,145,.13);box-shadow:0 12px 36px rgba(52,67,110,.07)}
:root[data-theme=light] .cd,:root[data-theme=light] .kp{background:linear-gradient(145deg,rgba(255,255,255,.91),rgba(255,255,255,.62));border-color:rgba(255,255,255,.9);box-shadow:0 16px 42px rgba(52,67,110,.09),inset 0 1px 0 #fff}
:root[data-theme=light] input,:root[data-theme=light] select,:root[data-theme=light] .fi{background:rgba(255,255,255,.65);border-color:rgba(84,98,145,.16);color:var(--tx)}:root[data-theme=light] .stat div,:root[data-theme=light] .ti,:root[data-theme=light] #ci,:root[data-theme=light] .note{background:rgba(255,255,255,.58);border-color:rgba(84,98,145,.12)}
:root[data-theme=light] .seg{background:rgba(255,255,255,.55);border-color:rgba(84,98,145,.12)}:root[data-theme=light] .m.a,:root[data-theme=light] .chatbox,:root[data-theme=light] .acard{background:rgba(255,255,255,.76);border-color:rgba(84,98,145,.15)}:root[data-theme=light] .toast{background:rgba(255,255,255,.94);border-color:rgba(84,98,145,.16)}
@media(max-width:1100px){main{padding-left:22px;padding-right:22px}.g4{gap:11px}}
@media(max-width:860px){main{padding:calc(13px + env(safe-area-inset-top,0px)) 13px calc(94px + env(safe-area-inset-bottom,0px))}.cd{padding:16px;border-radius:19px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.hd{margin-bottom:17px}.hd h1{font-size:21px}.kp b{font-size:21px}.kp .ic{width:36px;height:36px}.hero{border-radius:20px}.hero .bg{font-size:29px}.hero .hs{gap:7px}.hero .hs div{padding:9px 8px;border-radius:12px}.hero .hs b{font-size:14px}#bn{padding:8px 7px calc(8px + env(safe-area-inset-bottom,0px))}#bn button{gap:3px;font-size:10px}#bn button b{font-size:20px}.stat{grid-template-columns:repeat(2,minmax(0,1fr))}.stat div{padding:10px}.stat b{font-size:15px}#cs{margin:5px 0}.grid{gap:11px}.g4{gap:10px}.r{font-size:13px}.expense-add{max-width:100%}}
@media(max-width:380px){main{padding-left:10px;padding-right:10px}.cd{padding:13px}.hero .bg{font-size:25px}.kp b{font-size:19px}.hero .hs{grid-template-columns:1fr 1fr}.hero .hs div:last-child{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){.cd,.ni,button{transition:none!important}.cd:hover{transform:none}}

/* WALLPAPER LAYER AND DEEPER GLASS FINISH */
body{position:relative;isolation:isolate}
body::before{z-index:1}
#wallpaper{display:none;position:fixed;inset:0;z-index:0;pointer-events:none;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:var(--wall-opacity,.48);transition:opacity .2s ease}
main{z-index:2}
#sb{z-index:30}
#bn{z-index:40}
.cd{background:linear-gradient(145deg,rgba(29,39,68,.54),rgba(13,22,43,.43));border-color:rgba(205,216,255,.19);backdrop-filter:blur(30px) saturate(165%);-webkit-backdrop-filter:blur(30px) saturate(165%);box-shadow:0 18px 58px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.12)}
.cd:before{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent)}
.hero,.aic{backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%)}
#sb{background:rgba(7,12,27,.66);backdrop-filter:blur(32px) saturate(165%);-webkit-backdrop-filter:blur(32px) saturate(165%)}
.hd{padding:4px 2px 0}
.wall-setting{overflow:visible}
.wall-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.wall-head h3{margin-bottom:5px}
.wall-head p{margin:0;max-width:620px;font-size:13px}
.wall-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.wall-upload{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:linear-gradient(130deg,#8065f2,#557ff0);color:#fff;font-weight:650;cursor:pointer;box-shadow:0 7px 22px rgba(94,91,220,.25)}
.wall-upload input{display:none}
.wall-range{display:flex;align-items:center;gap:12px;min-width:min(100%,280px);flex:1;padding:8px 12px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.045)}
.wall-range>span{font-size:12px;white-space:nowrap;color:var(--mu)}
.wall-range b{color:var(--tx);font-variant-numeric:tabular-nums}
.wall-range input{min-width:90px;padding:0;border:0;background:transparent;accent-color:var(--ac)}
.wall-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--tx)}
.wall-status-dot{width:8px;height:8px;border-radius:50%;background:var(--tq);box-shadow:0 0 12px var(--tq)}
:root[data-theme=light] .cd{background:linear-gradient(145deg,rgba(255,255,255,.79),rgba(255,255,255,.58));border-color:rgba(255,255,255,.78)}
:root[data-theme=light] #sb{background:rgba(255,255,255,.70)}
:root[data-theme=light] .wall-range{background:rgba(255,255,255,.58)}
@media(max-width:860px){
 .wall-actions{align-items:stretch}.wall-upload,.wall-actions>button{flex:1;min-width:calc(50% - 6px);text-align:center}
 .wall-range{flex:1 1 100%;min-width:100%;justify-content:space-between}
 .wall-range input{max-width:46%}
 .wall-status{align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){#wallpaper{transition:none}}

/* REFINED INTERACTIVE BALANCE CHART */
.curve-wrap{position:relative;margin:2px -2px 0;padding:13px 12px 10px;border:1px solid rgba(170,190,240,.12);border-radius:19px;background:linear-gradient(145deg,rgba(5,12,29,.28),rgba(255,255,255,.025));overflow:hidden}
.curve-wrap:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
.curve-topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 4px 2px}
.curve-period{font-size:12px;text-transform:capitalize;color:var(--mu);font-weight:650;letter-spacing:.25px}
.curve-status{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:99px;background:rgba(255,255,255,.055);border:1px solid var(--bd);font-size:11px;color:var(--tx);white-space:nowrap}
.curve-status i{width:7px;height:7px;border-radius:50%;box-shadow:0 0 10px currentColor}
.curve-svg{display:block;width:100%;height:auto;overflow:visible;margin:0;touch-action:pan-y;outline:none}
.curve-svg:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:12px}
.curve-hit{cursor:crosshair}
.curve-legend{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:4px 0 1px;color:var(--mu);font-size:11px}
.curve-legend span{display:inline-flex;align-items:center;gap:7px}
.curve-legend i{display:inline-block;width:18px;height:3px;border-radius:9px}
.leg-real{background:linear-gradient(90deg,#8affeb,#35dfc4);box-shadow:0 0 8px #35dfc455}
.leg-ideal{height:2px!important;background:var(--mu);opacity:.48}
.leg-forecast{height:3px!important;background:linear-gradient(90deg,#35dfc4,#8affeb);opacity:.9;box-shadow:0 0 8px #35dfc455}
.curve-tooltip{margin-top:10px;padding:12px 14px;border:1px solid rgba(135,190,210,.18);border-radius:15px;background:linear-gradient(110deg,rgba(45,212,191,.075),rgba(121,87,232,.10));min-height:72px}
.curve-tip-date{font-size:12px;font-weight:700;color:var(--mu);text-transform:capitalize;margin-bottom:8px}
.curve-tip-values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.curve-tip-values>div{min-width:0}
.curve-tip-values small{display:block;color:var(--mu);font-size:10px;margin-bottom:2px}
.curve-tip-values b{display:block;font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.curve-tip-events{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.curve-tip-events span{font-size:11px;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.055);color:var(--tx)}
.curve-tip-empty{font-size:11px;color:var(--mu);margin-top:5px}
.curve-stats{margin-bottom:12px}
@keyframes curveDraw{to{stroke-dashoffset:0}}
@keyframes curveFillIn{from{opacity:0}to{opacity:1}}
#pg.ani .curve-line{stroke-dasharray:1;stroke-dashoffset:1;animation:curveDraw 1.35s cubic-bezier(.2,.8,.2,1) .08s forwards}
.curve-line{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--curve-line,#35dfc4) 42%,transparent));stroke-linecap:round;stroke-linejoin:round}
.curve-projection{animation:curveProjection 5.2s cubic-bezier(.4,0,.2,1) infinite;transform-origin:center;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--curve-line,#35dfc4) 42%,transparent));vector-effect:non-scaling-stroke}
.curve-line{stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--curve-line,#35dfc4) 48%,transparent))}
.curve-wrap .curve-svg path{shape-rendering:geometricPrecision}
@keyframes curveProjection{0%,100%{opacity:.58;filter:drop-shadow(0 0 3px currentColor)}50%{opacity:1;filter:drop-shadow(0 0 11px currentColor)}}
.curve-wrap{background:radial-gradient(ellipse at 52% 8%,color-mix(in srgb,var(--curve-line,#35dfc4) 8%,transparent),transparent 62%),linear-gradient(145deg,rgba(5,12,29,.34),rgba(255,255,255,.025))}
.curve-svg .curve-fill{transition:opacity .5s ease}
.curve-event{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--curve-line,#35dfc4) 55%,transparent))}
.curve-status{backdrop-filter:blur(8px)}
.curve-topline{padding:2px 2px 5px}

#pg.ani .curve-fill{opacity:0;animation:curveFillIn .85s ease .28s forwards}
#pg.ani #todayHalo{animation:curveHalo 2.6s ease-in-out infinite}
@keyframes curveHalo{50%{opacity:.9;r:16}}
:root[data-theme=light] .curve-wrap{background:linear-gradient(145deg,rgba(255,255,255,.5),rgba(235,240,255,.42));border-color:rgba(84,110,160,.16)}
:root[data-theme=light] .curve-tooltip{background:linear-gradient(110deg,rgba(45,180,170,.09),rgba(121,87,232,.07));border-color:rgba(84,110,160,.16)}
@media(max-width:860px){
 .curve-wrap{margin:0 -2px;padding:10px 7px 9px;border-radius:16px}
 .curve-topline{margin:0 4px 4px}
 .curve-legend{gap:10px;font-size:10px}
 .curve-tooltip{padding:10px 11px;margin-top:8px}
 .curve-tip-values{gap:5px}
 .curve-tip-values b{font-size:12px}
 .curve-tip-events span{font-size:10px}
}
@media(max-width:360px){.curve-tip-values{grid-template-columns:1fr 1fr}.curve-tip-values>div:last-child{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){#pg.ani .curve-line,#pg.ani .curve-fill,#pg.ani #todayHalo{animation:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:1}}

/* PREMIUM SIDEBAR, NAVIGATION AND BUTTON SYSTEM */
#sb{
 display:flex;flex-direction:column;gap:0;padding:0 12px 13px;overflow:hidden;
 background:linear-gradient(180deg,rgba(8,13,30,.94),rgba(10,17,37,.84));
 border-right:1px solid rgba(174,190,255,.13);
 box-shadow:16px 0 48px rgba(0,0,0,.16);
}
.sidebar-brand{flex:none;padding:22px 8px 18px;border-bottom:1px solid rgba(177,193,245,.10);margin-bottom:8px;position:relative}
.sidebar-brand:after{content:"";position:absolute;bottom:-1px;left:8px;width:74px;height:1px;background:linear-gradient(90deg,#947aff,transparent)}
#sb .logo{display:flex;align-items:center;gap:10px;padding:0;font-size:19px;font-weight:760;letter-spacing:-.7px;line-height:1.2}

.brand-live{width:7px;height:7px;margin-left:auto;border-radius:50%;background:#48dbc4;box-shadow:0 0 12px #48dbc4aa}

.sidebar-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:1px 2px 14px;scrollbar-width:thin;scrollbar-color:rgba(151,139,226,.26) transparent}
.sidebar-scroll::-webkit-scrollbar{width:4px}.sidebar-scroll::-webkit-scrollbar-thumb{background:rgba(151,139,226,.25);border-radius:9px}
.nav-group{margin:0 0 10px;padding:0 0 9px;border-bottom:1px solid rgba(177,193,245,.075)}
.nav-group:last-child{border-bottom:0;margin-bottom:0}
#sb .gt{display:flex;align-items:center;gap:9px;padding:12px 9px 8px;margin:0;color:#8290b0;font-size:9px;font-weight:750;letter-spacing:1.45px;text-transform:uppercase}
#sb .gt i{height:1px;flex:1;background:linear-gradient(90deg,rgba(143,157,205,.18),transparent)}
.nav-items{display:grid;gap:4px}
#sb .ni{
 position:relative;isolation:isolate;display:flex;align-items:center;gap:11px;width:100%;min-height:43px;
 margin:0;padding:7px 10px;border:1px solid transparent;border-radius:13px;
 background:transparent!important;color:#a3aec9;font-size:12.5px;font-weight:560;letter-spacing:.05px;
 text-align:left;box-shadow:none!important;overflow:hidden;
 transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease;

bud(){const T=totals(),customCap=Math.max(0,num(S.set.monthBudget||0)),cap=customCap||Math.max(0,T.rev),capSource=customCap?'plafond défini':T.rev?'revenus du mois':'',pct=cap?T.dep/cap*100:0,left=cap-T.dep,level=pct>=100?'over':pct>=90?'warn':pct>=75?'near':'safe',shown=Math.min(100,Math.max(0,pct));let status='Tu gardes le contrôle de tes dépenses';if(!cap)status='Ajoute un revenu ou définis un plafond pour suivre ton budget';else if(pct>=100)status='Tu as dépassé ton budget mensuel';else if(pct>=90)status='Attention, tu es tout près de ta limite';else if(pct>=75)status='Tu approches de ta limite mensuelle';return`<section class="total-spending spending-dashboard ${level}"><div class="spending-head"><div><span class="ts-eyebrow"><i></i> TOTAL SPENDING <span>· CE MOIS-CI</span></span><h2>Ton budget en un coup d’œil</h2><p>Garde le contrôle de tes dépenses, sans mauvaise surprise.</p></div><span class="spending-live"><i></i> Suivi en direct</span></div><div class="spending-main"><div class="spending-total"><span>Total dépensé</span><strong>${eur(T.dep)}</strong><small>${cap?'sur '+eur(cap)+' de '+capSource:'Définis ton plafond mensuel ci-dessous'}</small></div><div class="spending-ring" data-target="${shown}" data-number="${cap?Math.round(pct):''}" style="--spend-pct:0%"><div><strong>${cap?'0%':'—'}</strong><span>utilisé</span></div></div></div><div class="spending-progress-label"><span>Progression du budget</span><b>${cap?eur(Math.max(0,left))+' restant':'Aucun plafond défini'}</b></div><div class="ts-meter"><div class="ts-meter-fill" data-target="${shown}" style="width:0%"></div></div><div class="spending-stats"><div><span><i class="sp-stat-dot spent"></i> Dépenses réelles</span><b>${eur(T.dep)}</b></div><div><span><i class="sp-stat-dot available"></i> Reste du plafond</span><b>${cap?eur(Math.max(0,left)):'—'}</b></div><div><span><i class="sp-stat-dot limit"></i> Plafond mensuel</span><b>${cap?eur(cap):'—'}</b></div></div><div class="grid g3" style="margin-top:12p function cleanT(t){return t.replace(/[*_#`>]/g,'').replace(/€/g,' euros').replace(/\s+/g,' ')}
function bestFrenchVoice(){
 const all=speechSynthesis.getVoices().filter(v=>/^fr(?:-|_|$)/i.test(v.lang));
 if(!all.length)return null;
 const score=v=>{
  const n=(v.name+' '+v.lang).toLowerCase();let p=0;
  if(/^fr-fr$/i.test(v.lang))p+=35;
  if(/audrey|am[eé]lie|hortense|denise|lea|léa|julie|celine|céline|marie|thomas|siri.*fr|fr.*siri/i.test(n))p+=48;
  if(/enhanced|premium|natural|neural|online|wavenet/i.test(n))p+=65;
  if(/google|microsoft/i.test(n))p+=18;
  if(/compact|basic|desktop/i.test(n))p-=20;
  return p
 };
 return all.sort((a,b)=>score(b)-score(a))[0]
}
async function speak(t){
 if(!window.speechSynthesis||typeof SpeechSynthesisUtterance==='undefined')return toast('Voix indisponible sur cet appareil');
 stopSpeak();
 // Certains navigateurs sur ordinateur chargent leurs voix après l’ouverture de la page.
 if(!speechSynthesis.getVoices().length){
  await new Promise(resolve=>{
   let done=false;const finish=()=>{if(done)return;done=true;speechSynthesis.removeEventListener('voiceschanged',finish);resolve()};
   speechSynthesis.addEventListener('voiceschanged',finish);setTimeout(finish,900)
  })
 }
 const u=new SpeechSynthesisUtterance(cleanT(t));
 u.lang='fr-FR';u.voice=bestFrenchVoice();u.rate=.91;u.pitch=1.04;u.volume=1;
 u.onstart=()=>setVS('speak');u.onend=u.onerror=()=>setVS('idle');
 speechSynthesis.speak(u)
}

 const cv=curConv();msgs=cv.msgs;if(!msgs.length)cv.title=q.slice(0,42);msgs.push({r:'u',t:q},{r:'a',t:'…'});const bi=msgs.length-1;go();setVS('think');

 const sys='Tu es le véritable assistant IA de Mon Budget, mais tu peux aussi répondre naturellement à toutes les questions générales (études, travail, technologie, organisation, culture, etc.). Réponds en français, tutoie et adapte ton niveau à la question. Sois intelligent, précis, naturel et utile. Évite les réponses génériques et répétitives : comprends exactement la demande, réponds directement, explique le raisonnement utile et donne des exemples concrets quand cela aide. Réponds court et directement : 3 à 6 phrases ou quelques puces maximum par défaut. Ne développe que si l’utilisateur le demande. Structure avec de petits titres ou listes seulement si cela améliore la lisibilité. Si une information manque vraiment, pose une seule question ciblée. Pour les calculs, vérifie les résultats et montre les étapes utiles. Pour les questions qui dépendent de l’actualité ou de données externes non fournies, précise honnêtement tes limites et ne prétends pas avoir vérifié Internet.\\nRÈGLES BUDGÉTAIRES : utilise uniquement les données de l’application transmises ci-dessous pour parler de la situation financière de l’utilisateur. N’invente jamais de revenus, dépenses, transactions, dates ou prix. Distingue clairement les données réelles des estimations et explique les calculs. Repère les tendances et incohérences éventuelles, compare les catégories, propose des actions réalistes et personnalisées, et tiens compte des objectifs d’épargne et des dépenses récurrentes. Ne culpabilise jamais l’utilisateur. Ne prétends pas avoir modifié son budget ou effectué une opération : demande confirmation et explique comment la faire dans l’application. Ne demande jamais de mot de passe, de coordonnées bancaires ou de clé API.\\nDonnées : '+ctx()+'\\n\\nConversation et message :';
 const hist=msgs.slice(0,bi-1).filter(m=>m.t!=='…').slice(-6).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}));
 try{let typing=Promise.resolve();const r=await AIFN([...hist,{role:'user',content:sys+' '+q}],{onText:({text})=>{typing=set(text)}});const t=(r&&r.text)||msgs[bi].t;await typing;msgs[bi].t=t;msgs[bi].c=acard();go();if(U.tts)speak(t);else setVS('idle')}
 catch(e){const c=e&&e.code;set(c==='not_granted'?'Autorisation refusée : réponds « Autoriser » quand la page le demande.':c==='rate_limited'?'Trop de demandes, attends quelques secondes.':'L’assistant n’a pas pu répondre ('+((e&&e.message)||c||'erreur')+').');setVS('idle')}}

function animateBudgetVisuals(){const ring=document.querySelector('.spending-ring');if(!ring)return;const meter=document.querySelector('.ts-meter-fill');const target=Math.max(0,Math.min(100,Number(ring.dataset.target)||0));const number=ring.dataset.number;const start=performance.now(),duration=1050;function frame(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,3),value=target*ease;ring.style.setProperty('--spend-pct',value+'%');const label=ring.querySelector('strong');if(label&&number!=='')label.textContent=Math.round(Number(number)*ease)+'%';if(meter)meter.style.width=value+'%';if(t<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
